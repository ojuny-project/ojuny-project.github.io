name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and content checks
        run: npm run check

      - name: Docs link and frontmatter checks
        run: node scripts/check-docs.mjs

      - name: Docs prose metrics
        run: node scripts/docs-metrics.mjs --json

      - name: Build site
        run: npm run build
